spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_INVENTORY}?rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

    hikari:
      maximum-pool-size: ${INVENTORY_SERVICE_POOL_MAX_SIZE}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL-AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: true
    open-in-view: false

  batch:
    jdbc:
      initialize-schema: ${BATCH_JDBC_INITIALIZE_SCHEMA}
      platform: mysql
    job:
      enabled: true

  sql:
    init:
      mode: ${SQL_INIT_MODE}
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: inventory-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      auto-offset-reset: latest
      max-poll-records: 500
      properties:
        isolation.level: read_committed
        spring.json.trusted.packages: "io.playground.*"
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: manual
      concurrency: 3
      type: single
      poll-timeout: 3000
      auto-startup: true

logging:
  level:
    root: WARN
    io.playground: ERROR

    org.springframework.jdbc.core: ERROR
    org.springframework.jdbc.core.StatementCreatorUtils: ERROR

    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR

    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
